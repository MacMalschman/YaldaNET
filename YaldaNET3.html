<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>MINT Mindmap – Vollständige 2D/3D-Version</title>
<style>

:root{--bg:rgb(250,222,213);--panel:rgb(187,223,218);--ink:#111;}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
#topbar{position:fixed;z-index:50;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #333;border-radius:12px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#topbar button,#topbar input[type=search]{font-size:14px;padding:6px 10px;border-radius:10px;border:1px solid #333;background:#fff;outline:none}
#topbar button{cursor:pointer}
#graph2d,#graph3d{position:fixed;inset:0}
#graph3d{display:none;pointer-events:auto;cursor:grab}
#status3d{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:40;background:#fff;border:1px solid #333;border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;pointer-events:none;white-space:pre-line}
#c2d{width:100%;height:100%;display:block}
.tooltip{position:fixed;z-index:70;padding:4px 6px;font-size:12px;background:#fff;border:1px solid #333;border-radius:6px;pointer-events:none;display:none}

/* Panel wie im Original (#links3d) */
#links3d{position:fixed;top:0;right:0;height:100vh;width:360px;background:var(--panel);border-left:1px solid #e7b7a8;z-index:60;box-shadow:-6px 0 18px rgba(0,0,0,.1);display:none;overflow:auto;padding:12px}
#links3d .close{position:absolute;top:8px;right:8px;background:#fff;border:1px solid #333;border-radius:6px;padding:2px 8px;cursor:pointer}
#links3d h3{margin:6px 0 8px;font-size:16px}
#links3d .sect{margin:10px 0}
#links3d a{display:block;margin:2px 0;text-decoration:none;color:#0645ad;word-break:break-word}

/* Favoriten UI */
.fav-btn {
  background: #fff; border: 1px solid #333; border-radius: 8px;
  padding: 2px 8px; cursor: pointer; margin-left: 8px; font-weight: 700;
}
.fav-btn.active { color: #b8860b; border-color: #b8860b; }
#btnFavFilter { font-weight: 700; }
.fav-ring { stroke: #f0b400; stroke-width: 2px; }

#legend{position:fixed;bottom:12px;left:12px;z-index:45;background:#fff;border:1px solid #333;border-radius:10px;padding:8px 10px;max-width:50vw;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#legend h4{margin:0 0 6px 0;font-size:12px}
#legend .row{display:flex;flex-wrap:wrap;gap:10px}
#legend .item{display:flex;align-items:center;gap:6px;font-size:12px}
#legend .sw{width:12px;height:12px;border-radius:3px;border:1px solid #333}
#selInterStyle{font-size:14px;border:1px solid #333;border-radius:10px;padding:6px 8px;background:#fff}


#legend button{display:none !important}
</style>
<script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three-spritetext@1.9.3/dist/THREE.SpriteText.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>

<style id="reset-min-css">
  .nodes text, .node text, text.node-label, g.node text, .graph text { font-size: 16px !important; }
  #minimap svg text { font-size: 12px !important; }
</style>

</head>
<body>
<div aria-label="Mindmap Bedienung" id="topbar" role="toolbar">
<button id="btnFit" title="Ansicht automatisch einpassen">Fit</button>
<input id="txtSearch" placeholder="Suche Knoten..." type="search"/>
<span id="lblCount" style="align-self:center;font-size:12px;color:#333"></span>
<select id="selInterStyle" style="display:none" title="Darstellung von inter-group Kanten">
<option selected="" value="gradient">Inter-Group: Gradient+Strich</option>
<option value="mix">Inter-Group: Mischfarbe</option>
<option value="source">Inter-Group: Quellfarbe</option>
</select>
</div>
<div id="status3d"></div>
<div id="graph2d"><canvas id="c2d"></canvas></div>
<div id="graph3d"></div>

<!-- Panel mit originalen IDs -->
<div id="links3d">
<button class="close" title="Schließen">×</button>
<div id="links3d-content"></div>
</div>

// Favoriten (LocalStorage)
(function(){
  const KEY = 'mindmap_favs_v1';
  function load(){ try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch { return new Set(); } }
  function save(set){ localStorage.setItem(KEY, JSON.stringify(Array.from(set))); }
  window.__mindmapFavs = {
    set: load(),
    save(){ save(this.set); },
    toggle(id){
      if (!id) return false;
      if (this.set.has(id)) this.set.delete(id); else this.set.add(id);
      this.save(); return this.set.has(id);
    },
    has(id){ return this.set.has(id); }
  };
})();

fav.addEventListener('click', ()=>{ const active = window.__mindmapFavs.toggle(node?.id); fav.classList.toggle('active', active); document.dispatchEvent(new CustomEvent('mindmap:favs-updated')); });
head.appendChild(fav);
content.appendChild(head);
    const linkGroups = (node && node.links) ? node.links : {};
    const entries = Object.entries(linkGroups);
    if (entries.length === 0) {
      const p = document.createElement('p');
      p.textContent = "Keine gespeicherten Links für diesen Knoten.";

    } else {
      for (const [section, arr] of entries) {

        content.appendChild(wrap);

    }
  }

  function openPanel(node){ renderLinks(node); root.style.display = 'block'; }
  function closePanel(){ root.style.display = 'none'; }
  root.querySelector('.close')?.addEventListener('click', closePanel);

  // Globale API für den Core
  window.__mindmapPanel = { open: openPanel, close: closePanel };
})();

<script>
function makeTextSprite(message, font='14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif', color='#111'){
  const canvas = document.createElement('canvas');
  const g = canvas.getContext('2d');
  g.font = font;
  const pad=8, h=28;
  const w = Math.ceil(g.measureText(message).width) + pad*2;
  canvas.width = w; canvas.height = h;
  g.font = font; g.fillStyle=color; g.textBaseline='middle';
  g.fillText(message, pad, h/2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest:false, depthWrite:false });
  const spr = new THREE.Sprite(mat);
  const scale=0.22; spr.scale.set(w*scale, h*scale, 1);
  spr.renderOrder = 999;
  return spr;
}

<script>
// Small hex color helpers used for 3D inter-group styling
function hexToRgb(h){ const c=h.replace('#',''); return {r:parseInt(c.slice(0,2),16), g:parseInt(c.slice(2,4),16), b:parseInt(c.slice(4,6),16)}; }
function mixHex(c1,c2,t=0.5){ const a=hexToRgb(c1), b=hexToRgb(c2);
  const r=Math.round(a.r*(1-t)+b.r*t).toString(16).padStart(2,'0');
  const g=Math.round(a.g*(1-t)+b.g*t).toString(16).padStart(2,'0');
  const bl=Math.round(a.b*(1-t)+b.b*t).toString(16).padStart(2,'0');
  return '#'+r+g+bl;
}

<script>

(() => {
  const cfg = {
    canvasPxRatio: Math.min(2, window.devicePixelRatio || 1),
    nodeRadius: 11,
    linkDist: 200,
    charge: -550,
    zoomExtent: [0.06, 6],
    color: d3.scaleOrdinal().range(d3.schemeTableau10.concat(d3.schemeSet3))
  };

// --- Haupttopic-Farben (nach ID/Name) ---
const TOPIC_COLORS = {
  "Mathematik": "#e6194b",
  "Informatik": "#3cb44b",
  "Data Science": "#ffe119",
  "Künstliche Intelligenz": "#4363d8",
  "Physik": "#f58231",
  "Chemie": "#911eb4",
  "Biochemie": "#46f0f0",
  "Molekularbiologie": "#f032e6",
  "Genetik": "#bcf60c",
  "Geowissenschaften": "#fabebe",
  "Astronomie": "#008080",
  "Technik": "#e6beff",
  "Maschinenbau": "#9a6324",
  "Elektrotechnik": "#800000",
  "Robotik": "#aaffc3",
  "Medizintechnik": "#000075",
  "Nachhaltigkeit": "#ffd8b1",
  "Energietechnik": "#808000",
  "Open Science": "#a9a9a9",
  "Bildung": "#6495ed",
  "Neurowissenschaften": "#ff7f50"
};

function colorForNode(node){
  if (!node) return '#888';

  const name = String(node.id || '').toLowerCase();
  // Geschichts-Knoten: spezielle Farbe RGB(151,159,97)
  if (
    name.includes('geschichte') ||
    name.includes('revolution') ||
    name.includes('antike naturphilosophie') ||
    name.includes('wissenschaft und gesellschaft') ||
    name.includes('baekeland')
  ){
    return 'rgb(151,159,97)';
  }

  const byId = TOPIC_COLORS[node.id];
  if (byId) return byId;
  // Fallback: bestehende Palettenlogik (cfg.color) weiter nutzen
  try { return cfg.color(node.group || 'default'); } catch(e){}
  return '#888';
}


  
  // --- Helpers: color mixing + favorites ---
  function hexToRgb(hex){ const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return m ? {r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16)} : null; }
  function rgbToHex(r,g,b){ const to = v => v.toString(16).padStart(2,'0'); return '#' + to(r) + to(g) + to(b); }
  function mix(a,b,t=0.5){ const A=hexToRgb(a), B=hexToRgb(b); if(!A||!B) return a; return rgbToHex(Math.round(A.r*(1-t)+B.r*t), Math.round(A.g*(1-t)+B.g*t), Math.round(A.b*(1-t)+B.b*t)); }
  function colorForGroup(g){ try { return cfg.color(g||'default'); } catch(e){ return '#888'; } }
  function edgeColor(l){ const s = (typeof l.source==='object')? l.source : BASE.nodes.find(n=>n.id===l.source); const t = (typeof l.target==='object')? l.target : BASE.nodes.find(n=>n.id===l.target); const sg=s?.group, tg=t?.group; const cs = colorForGroup(sg), ct = colorForGroup(tg); if (sg && tg && sg===tg) return cs; return mix(cs, ct, 0.5); }
  function isFav(id){ return !!(window.__mindmapFavs && window.__mindmapFavs.has(id)); }
const BASE = window.MINDMAP_DATA || {nodes:[],links:[]};

  // Status-Overlay

  // Insert Fav-Filter button if missing
  (function(){ const bar = document.getElementById('topbar'); if (!bar) return;
    if (!document.getElementById('btnFavFilter')) {
      const b = document.createElement('button'); b.id='btnFavFilter'; b.textContent='★ Favoriten';
      b.title='Nur Favoriten zeigen / zurücksetzen';
      b.addEventListener('click', ()=>{ favFilterActive = !favFilterActive; b.classList.toggle('active', favFilterActive); draw2D(); apply3DFilter(); });
      bar.appendChild(b);
    }
  })();
  let favFilterActive = false;

  const status3d = document.getElementById('status3d');
  function setStatus(msg, show=true){ if(!status3d) return; status3d.textContent = msg||''; status3d.style.display = show ? 'block' : 'none'; }

  // 2D (Canvas)
  const c2d = document.getElementById('c2d');
  const ctx = c2d ? c2d.getContext('2d') : null;
  let width = 0, height = 0;
  let transform = d3.zoomIdentity;
  let sim, nodes2d, links2d, quadtree;
  let hoverNode2d = null;

  function resizeCanvas() {
    if (!c2d || !ctx) return;
    width = c2d.clientWidth || window.innerWidth; height = c2d.clientHeight || window.innerHeight;
    const ratio = cfg.canvasPxRatio;
    c2d.width = Math.round(width * ratio);
    c2d.height = Math.round(height * ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0);
  }

  function init2D() {
    if (!ctx) return;
    ({nodes: nodes2d, links: links2d} = BASE);
    try {
      const saved = localStorage.getItem('mint_mindmap_layout_v1');
      if (saved) {
        const pos = JSON.parse(saved);
        if (pos && typeof pos === 'object') {
          nodes2d.forEach(n => {
            const p = pos[n.id];
            if (p && typeof p.x === 'number' && typeof p.y === 'number') {
              n.x = p.x;
              n.y = p.y;
              n.fx = p.x;
              n.fy = p.y;
            }
          });
        }
      }
    } catch(e) {}

    sim = d3.forceSimulation(nodes2d).alphaDecay(0.008).velocityDecay(0.3)
      .force('link', d3.forceLink(links2d).id(d=>d.id).distance(cfg.linkDist).strength(0.6))
      .force('charge', d3.forceManyBody().strength(cfg.charge))
      .force('center', d3.forceCenter(width/2, height/2))
      .on('tick', () => { draw2D(); scheduleSaveLayout(); });

    const zoom = d3.zoom()
      .filter(ev => {
        if (ev.type === 'mousedown' && ev.button === 0 && c2d && typeof pickNode === 'function') {
          const rect = c2d.getBoundingClientRect();
          const x = ev.clientX - rect.left;
          const y = ev.clientY - rect.top;
          const n = pickNode(x, y);
          if (n) return false; // bei einem Knoten: Drag übernimmt
        }
        return true;
      })
      .scaleExtent(cfg.zoomExtent)
      .on('zoom', ev => { transform = ev.transform; draw2D(); });
    const drag = d3.drag()
      .subject(event => {
        const src = event.sourceEvent || event;
        const rect = c2d.getBoundingClientRect();
        const x = src.clientX - rect.left;
        const y = src.clientY - rect.top;
        const n = pickNode(x, y);
        return n || null;
      })
      .on('start', event => {
        if (!event.active && sim) sim.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      })
      .on('drag', event => {
        const src = event.sourceEvent || event;
        const rect = c2d.getBoundingClientRect();
        const px = src.clientX - rect.left;
        const py = src.clientY - rect.top;
        event.subject.fx = (px - transform.x) / transform.k;
        event.subject.fy = (py - transform.y) / transform.k;
      })
      .on('end', event => {
        if (!event.active && sim) sim.alphaTarget(0);
      });
    d3.select(c2d).call(zoom).call(drag);
    updateCount();
  }

  function draw2D() {
    if (!ctx) return;
    ctx.save();
    ctx.clearRect(0,0,width,height);
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);
    const filter = (typeof getFilter==='function') ? getFilter() : null;

    // Group hulls (background)
    if (typeof d3 !== 'undefined' && d3.polygonHull){
      (function drawHulls(){
        const groups = new Map();
        for (const n of BASE.nodes){
          if (n.x==null || n.y==null) continue;
          const g = n.group || 'default';
          if (!groups.has(g)) groups.set(g, []);
          groups.get(g).push([n.x, n.y]);
        }
        for (const [g, pts] of groups){
          if (!pts || pts.length < 3) continue;
          const hull = d3.polygonHull(pts);
          if (!hull) continue;
          ctx.beginPath();
          ctx.moveTo(hull[0][0], hull[0][1]);
          for (let i=1;i<hull.length;i++) ctx.lineTo(hull[i][0], hull[i][1]);
          ctx.closePath();
          const c = cfg.color(g);
          const k = (transform && transform.k) ? transform.k : 1;
          ctx.fillStyle = hexToRgba(c, 0.07);
          ctx.strokeStyle = hexToRgba(c, 0.18);
          ctx.lineWidth = Math.max(0.5, 1/k);
          ctx.fill(); ctx.stroke();
        }
      })();
    }

    // Links
    ctx.globalAlpha = 0.85;
    BASE.links.forEach(l => {
      const s = (typeof l.source==='object')? l.source : BASE.nodes.find(n=>n.id===l.source);
      const t = (typeof l.target==='object')? l.target : BASE.nodes.find(n=>n.id===l.target);
      if (!s || !t) return;
      if (filter && !filter(s) && !filter(t)) return;
      const sx = s.x, sy = s.y, tx = t.x, ty = t.y; if (sx==null||sy==null||tx==null||ty==null) return;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty);
      const sameGroup = (s.group||'') === (t.group||'');
      if (sameGroup){ ctx.setLineDash([]); ctx.strokeStyle = cfg.color(s.group||'default'); }
      else { ctx.setLineDash([3,3]); ctx.strokeStyle = '#666'; }
      const k = (transform && transform.k) ? transform.k : 1;
      const baseW = sameGroup ? 1.0 : 1.6;
      ctx.lineWidth = Math.max(0.8, baseW / k);
      ctx.stroke();
    });

    function hexToRgba(hex, a){
      try{
        const h = hex.replace('#',''); const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
        return `rgba(${r},${g},${b},${a})`;
      }catch(e){ return `rgba(120,120,120,${a})`; }
    }
    // Nodes
    ctx.globalAlpha = 1;
    for (const n of BASE.nodes) {
      const visible = !filter || filter(n);
      ctx.beginPath(); ctx.arc(n.x, n.y, cfg.nodeRadius, 0, 2*Math.PI);
      ctx.fillStyle = visible ? colorForNode(n) : '#ccc'; ctx.fill();
      if (isFav(n.id)) { ctx.lineWidth = 2; ctx.strokeStyle = '#f0b400'; ctx.stroke(); }
    }

    // Labels
    ctx.font='12px system-ui, -apple-system, Segoe UI, Roboto, Arial'; ctx.fillStyle='#222';
    for (const n of BASE.nodes) { if (filter && !filter(n)) continue; ctx.fillText(n.id, n.x+cfg.nodeRadius+2, n.y+4); }
    ctx.restore();

    // Hit-Quadtree auf Screen-Koordinaten
    quadtree = d3.quadtree().x(d => transform.applyX(d.x)).y(d => transform.applyY(d.y)).addAll(BASE.nodes);
  }

  function fit2D(padding=60){
    const xs = BASE.nodes.map(n=>n.x), ys = BASE.nodes.map(n=>n.y);
    const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
    const boxW=maxX-minX, boxH=maxY-minY;
    const scale = Math.min((width-2*padding)/boxW, (height-2*padding)/boxH, cfg.zoomExtent[1]);
    const tx = (width - scale*(minX+maxX))/2, ty = (height - scale*(minY+maxY))/2;
    transform = d3.zoomIdentity.translate(tx,ty).scale(scale); draw2D();
  }

  
  let saveLayoutScheduled = false;
  function scheduleSaveLayout(){
    if (saveLayoutScheduled) return;
    saveLayoutScheduled = true;
    setTimeout(() => {
      saveLayoutScheduled = false;
      if (!BASE || !BASE.nodes) return;
      const pos = {};
      BASE.nodes.forEach(n => {
        if (typeof n.x === 'number' && typeof n.y === 'number') {
          pos[n.id] = {x:n.x, y:n.y};
        }
      });
      try {
        localStorage.setItem('mint_mindmap_layout_v1', JSON.stringify(pos));
      } catch(e) {}
    }, 500);
  }

function pickNode(px, py){ if (!quadtree) return null; return quadtree.find(px, py, 20) || null; }
  const tooltip = (()=>{ const el=document.createElement('div'); el.className='tooltip'; document.body.appendChild(el); return el; })();
  if (c2d) {
    c2d.addEventListener('mousemove', (e)=>{
      const rect=c2d.getBoundingClientRect(); const px=e.clientX-rect.left, py=e.clientY-rect.top;
      const n=pickNode(px,py);
      if(n){ tooltip.style.display='block'; tooltip.style.left=(e.clientX+10)+'px'; tooltip.style.top=(e.clientY+10)+'px'; tooltip.textContent=n.id; c2d.style.cursor='pointer'; }
      else{ tooltip.style.display='none'; c2d.style.cursor='default'; }
    }, {passive:true});
    c2d.addEventListener('click', (e)=>{
      const rect=c2d.getBoundingClientRect(); const px=e.clientX-rect.left, py=e.clientY-rect.top;
      const n=pickNode(px,py); if(n) window.__mindmapPanel?.open(n);
    });
  }

  // 3D
  let graph3D = null, g3Initialized = false; let hoverNode3D = null;
  function init3D() {
    if (g3Initialized) return;
    const el = document.getElementById('graph3d');
    if (!el) return;

    if (typeof ForceGraph3D !== 'function') {
      // Fallback to 2D gracefully
      const g2 = document.getElementById('graph2d'); const g3 = document.getElementById('graph3d'); if (g3) g3.style.display='none'; if (g2) g2.style.display='block'; if (typeof btnToggle!=='undefined' && btnToggle) btnToggle.textContent='3D anzeigen';
      setStatus('3D-Bibliothek nicht geladen. Prüfe Internet/CDN.', true);
      return;
    }
    el.style.width = window.innerWidth + 'px';
    el.style.height = window.innerHeight + 'px';

    graph3D = ForceGraph3D()(el)
      .width(window.innerWidth).height(window.innerHeight)
      .graphData(BASE)
      .backgroundColor('rgb(250, 222, 213)')
      .nodeThreeObject(node => {
        const color = colorForNode(node);
        const group = new THREE.Group();
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(3.6,16,16), new THREE.MeshLambertMaterial({ color }));
        group.add(sphere);
        const SpriteCtor = (typeof window !== 'undefined' && typeof window.SpriteText === 'function') ? window.SpriteText : (typeof THREE !== 'undefined' && typeof THREE.SpriteText === 'function' ? THREE.SpriteText : null);
        if (SpriteCtor){
          const label = new SpriteCtor(String(node.id));
          if (typeof label.textHeight !== 'undefined') label.textHeight = 14;
          if (typeof label.color !== 'undefined') label.color = '#111';
          if (label.material){ label.material.depthTest=false; label.material.depthWrite=false; }
          if (label.position){ label.position.set(8,0,0); }
          if (typeof label.renderOrder !== 'undefined') label.renderOrder = 999;
          group.add(label);
        } else if (typeof makeTextSprite === 'function'){
          const label = makeTextSprite(String(node.id));
          if (label.position) label.position.set(8,0,0);
          group.add(label);
        }
        return group;
      })
      .linkColor(l => {
        const sid = (typeof l.source==='object')? l.source.id : l.source;
        const tid = (typeof l.target==='object')? l.target.id : l.target;
        const sN = BASE.nodes.find(n=>n.id===sid); const tN = BASE.nodes.find(n=>n.id===tid);
        if (!sN || !tN) return '#999';
        const c1 = cfg.color(sN.group || 'default');
        const same = (sN.group||'') === (tN.group||'');
        return same ? c1 : '#888';
      })
      .linkOpacity(l => {
        const sid = (typeof l.source==='object')? l.source.id : l.source;
        const tid = (typeof l.target==='object')? l.target.id : l.target;
        const sN = BASE.nodes.find(n=>n.id===sid); const tN = BASE.nodes.find(n=>n.id===tid);
        if (!sN || !tN) return 0.5;
        const same = (sN.group||'') === (tN.group||'');
        const hover = window.__hoverNodeId;
        if (hover){
          const involves = (sid===hover || tid===hover);
          return involves ? (same?0.85:0.95) : (same?0.25:0.45);
        }
        return same ? 0.9 : 0.6;
      })
      .linkWidth(l => {
        const sid = (typeof l.source==='object')? l.source.id : l.source;
        const tid = (typeof l.target==='object')? l.target.id : l.target;
        const sN = BASE.nodes.find(n=>n.id===sid); const tN = BASE.nodes.find(n=>n.id===tid);
        if (!sN || !tN) return 1;
        const same = (sN.group||'') === (tN.group||'');
        let w = same ? 1.2 : 2.0;
        if (window.__hoverNodeId && (sid===window.__hoverNodeId || tid===window.__hoverNodeId)) w *= 1.25;
        return w;
      })
      .linkDirectionalParticles(l => {
        const sid = (typeof l.source==='object')? l.source.id : l.source;
        const tid = (typeof l.target==='object')? l.target.id : l.target;
        const sN = BASE.nodes.find(n=>n.id===sid); const tN = BASE.nodes.find(n=>n.id===tid);
        if (!sN || !tN) return 0;
        const same = (sN.group||'') === (tN.group||'');
        return same ? 0 : 2;
      })
      .linkDirectionalParticleWidth(1.6)
      .linkDirectionalParticleColor(l => {
        const sid = (typeof l.source==='object')? l.source.id : l.source;
        const tid = (typeof l.target==='object')? l.target.id : l.target;
        const sN = BASE.nodes.find(n=>n.id===sid); const tN = BASE.nodes.find(n=>n.id===tid);
        if (!sN || !tN) return '#999';
        const c1 = cfg.color(sN.group || 'default');
        const c2 = cfg.color(tN.group || 'default');
        return mixHex(c1, c2, 0.5);
      })
      .linkDirectionalParticleSpeed(0.004)
.onNodeHover(node => { window.__hoverNodeId = node ? node.id : null; if (graph3D && graph3D.refresh) graph3D.refresh(); })
      .onNodeClick(node => {
        const dist = 100;
        const lookAt = {x: node.x||0, y: node.y||0, z: node.z||0};
        graph3D.cameraPosition({x: lookAt.x, y: lookAt.y, z: lookAt.z + dist}, lookAt, 600);
        window.__mindmapPanel?.open(node);
      });

    const controls = graph3D.controls && graph3D.controls();
    if (controls) {
      controls.enabled = true;
      controls.enableDamping = true; controls.dampingFactor = 0.08;
      controls.enableRotate = true; controls.enablePan = true; controls.enableZoom = true;
      if (THREE && THREE.MOUSE) controls.mouseButtons = { LEFT:THREE.MOUSE.ROTATE, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.PAN };
      if (THREE && THREE.TOUCH) controls.touches = { ONE:THREE.TOUCH.ROTATE, TWO:THREE.TOUCH.DOLLY_PAN };
    }
    if (graph3D.enableNodeDrag) graph3D.enableNodeDrag(false);
    graph3D.cameraPosition({ z: 260 });
      const scene = graph3D.scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const dl = new THREE.DirectionalLight(0xffffff, 0.6);
  dl.position.set(1,1,1);
  scene.add(dl);
  g3Initialized = true;
}

  function apply3DFilter() {
    if (!graph3D) return;
    const filter = getFilter();
    graph3D.nodeVisibility(node => !filter || filter(node));
    graph3D.linkVisibility(l => {
      const s = typeof l.source==='object'? l.source.id : l.source;
      const t = typeof l.target==='object'? l.target.id : l.target;
      const ns = BASE.nodes.find(n=>n.id===s), nt = BASE.nodes.find(n=>n.id===t);
      if (!filter) return true;
      return (ns && filter(ns)) || (nt && filter(nt));
    });
  }

  function updateCount(){ const el=document.getElementById('lblCount'); if (el) el.textContent = `${BASE.nodes.length} Knoten, ${BASE.links.length} Kanten`; }
  const btnToggle = document.getElementById('btnToggle');
  const btnFit = document.getElementById('btnFit');
  const btnAuto = document.getElementById('btnAuto');
  const txtSearch = document.getElementById('txtSearch');

  if (btnToggle) btnToggle.addEventListener('click', () => {
    const g2 = document.getElementById('graph2d');
    const g3 = document.getElementById('graph3d');
    const is2D = g2 && g2.style.display !== 'none';
    if (is2D) {
      g2.style.display = 'none';
      g3.style.display = 'block';
      btnToggle.textContent = '2D anzeigen';
      setStatus('3D initialisieren...');
      requestAnimationFrame(() => { init3D(); apply3DFilter(); setStatus('', false); });
    } else {
      if (g3) g3.style.display = 'none';
      if (g2) g2.style.display = 'block';
      btnToggle.textContent = '3D anzeigen';
      // Fix: after becoming visible, recalc canvas size and re-fit to avoid glitches
      requestAnimationFrame(()=>{ transform = d3.zoomIdentity; if (typeof resizeCanvas==='function') resizeCanvas(); if (typeof fit2D==='function') fit2D(); if (sim&&sim.alphaTarget){ sim.alphaTarget(0.3).restart(); setTimeout(()=>sim.alphaTarget(0),500);} });
}
  });

  if (btnFit) btnFit.addEventListener('click', () => {
    const is2D = document.getElementById('graph2d')?.style.display !== 'none';
    if (is2D) fit2D();
    else if (graph3D) graph3D.zoomToFit(500, 40);
  });

  if (btnAuto) btnAuto.addEventListener('click', () => {
    const controls = graph3D && graph3D.controls && graph3D.controls();
    if (!controls) { setStatus('3D-Steuerung nicht verfügbar', true); setTimeout(()=>setStatus('', false), 1500); return; }
    controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 1.0;
    btnAuto.textContent = controls.autoRotate ? 'Auto-Rotate: AN' : 'Auto-Rotate';
  });

  let filterText = "";
  const getFilter = () => {
    const q = (filterText || '').toLowerCase();
    return (n) => {
      const textOk = !q || (n.id||'').toLowerCase().includes(q);
      const favOk = !favFilterActive || isFav(n.id);
      return textOk && favOk;
    };
  };
  if (txtSearch) txtSearch.addEventListener('input', (e)=>{ filterText = e.target.value || ""; draw2D(); apply3DFilter(); });

  function onResize(){
    resizeCanvas();
    if (sim) sim.force('center', d3.forceCenter(c2d.clientWidth/2, c2d.clientHeight/2)).alpha(0.1).restart();
    if (graph3D) graph3D.width(window.innerWidth).height(window.innerHeight);
    draw2D();
  }
  window.addEventListener('resize', onResize);
  document.addEventListener('mindmap:favs-updated', ()=>{ draw2D(); apply3DFilter(); if (graph3D && graph3D.refresh) graph3D.refresh(); });

  // Boot
  resizeCanvas(); init2D(); setTimeout(()=>fit2D(), 800);
})();

</script>


<button id="btn-fit-quick" style="position:fixed; right:12px; bottom:12px; z-index:9999; padding:8px 10px; border-radius:10px; border:1px solid #ccc; background:#fff;">Fit</button>
<script>
  (function(){
    const btn = document.getElementById('btn-fit-quick');
    if (!btn) return;
    btn.addEventListener('click', function(){ try { fit2D(); } catch(e){} });
  })();
</script>
